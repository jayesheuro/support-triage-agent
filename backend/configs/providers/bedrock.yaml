# AWS Bedrock provider configuration — UNTESTED STUB
# boto3 is imported lazily; this provider will raise NotImplementedError
# on embed calls. Marked as stub in Phase 1; full implementation in a later phase.
# Requires AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION in .env

region: "us-east-1"

llm:
  model: "anthropic.claude-3-haiku-20240307-v1:0"
  temperature: 0.1
  max_tokens: 1024
  timeout_seconds: 60

embedder:
  model: "amazon.titan-embed-text-v1"
  dimension: 1536
  timeout_seconds: 30
